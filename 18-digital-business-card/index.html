<!doctype html>
<html>
  <head>
    <title>Jane Doe Business Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="card">
      <div class="info">
        <div class="name-job">
          <h1>Jane Doe</h1>
          <h2>Aspiring Web Developer</h2>
        </div>
        <p class="description">Still an aspiring web developer.</p>
        <div class="contacts">
          <p>Email: jane@doe.com</p>
          <p>Phone: +123456789</p>
        </div>
      </div>
      <div class="portrait">
        <img src="https://mimo.app/i/lori.png" alt="Jane Doe Portrait">
      </div>
    </div>
  </body>
</html>
