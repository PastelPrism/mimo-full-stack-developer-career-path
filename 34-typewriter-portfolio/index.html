<!doctype html>
<html>
  <head>
    <title>Tara's Portfolio</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Welcome to Tara's Portfolio</h1>
      <nav>
        <a href="#about">About Me</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
      </nav>
    </header>
    <section id="about">
      <h2>About Me</h2>
      <img src="https://mimo.app/i/tara.png" class="profile" alt="Tara looking through the door" />
      <p>Hi there! I am yet another aspiring webdeveloper. Besides websites I also like fruits and vegetables. They grow in my kitchen garden.</p>
    </section>
    <section id="skills">
      <h2>Skills</h2>
      <div class="skill-item">
        <label for="html-skill">HTML</label>
        <progress id="html-skill" value="90" max="100"></progress> 90%
      </div>
      <div class="skill-item">
        <label for="css-skill">CSS</label>
        <progress id="css-skill" value="75" max="100"></progress> 75%
      </div>
      <div class="skill-item">
        <label for="js-skill">JS</label>
        <progress id="js-skill" value="50" max="100"></progress> 50%
      </div>
    </section>
    <section id="projects">
      <h2>Projects</h2>
      <div class="project-list">
        <details>Project 1
          <summary>Project 1</summary>
          <p>Here is the story about project 1</p>
        </details>
      </div>
    </section>
  </body>
</html>
